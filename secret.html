        body {

            overflow: hidden;
        }

        /* The tiny star texture container */
        .star {
            position: absolute;
            background: #ffffff;
            /* Creates a sharp, tiny 4-pointed star texture */
            clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
            opacity: 0.8;
            will-change: transform;
        }

        /* Keyframes dynamically injected via JS below */

        header {
            border: double;
        }
.everything {
    border:double;

}

        }
    </style>
    <script>
        function generateStarfield() {
  const count = 200; // Total number of stars
  const body = document.body;

  
  const style = document.createElement('style');
  document.head.appendChild(style);

  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';

    
    const size = Math.random() * 4 + 2;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;

    
    star.style.left = `${Math.random() * 100}vw`;
    star.style.top = `${Math.random() * 100}vh`;
    
    // Vary opacity for visual depth
    star.style.opacity = Math.random() * 0.6 + 0.4;

    // Randomization logic for spins :)
    const spinStart = Math.floor(Math.random() * 360); 
    const spinEnd = Math.random() > 0.5 ? 180 : 360; 
    const duration = Math.random() * 10 + 10; // 10s to 20s

    // Create a unique animation name for this star
    const animName = `spin-${i}`;
    
    // Inject the keyframe into our dynamic style!!!
    style.sheet.insertRule(`
      @keyframes ${animName} {
        from { transform: rotate(${spinStart}deg); }
        to { transform: rotate(${spinStart + spinEnd}deg); }
      }
    `, style.sheet.cssRules.length);

    // Apply the animation to the star
    star.style.animation = `${animName} ${duration}s linear infinite`;

    body.appendChild(star);
  }
}

// Initialize the background on load
window.addEventListener('DOMContentLoaded', generateStarfield);

    </script>
